<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearts2Hearts Game</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #menu {
        position: absolute;
        width: 100%;
        height: 100vh;
        background: #ffcce6;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    #playBtn {
        padding: 20px 60px;
        font-size: 32px;
        border: none;
        border-radius: 20px;
        background: #7ed6ff;
        color: white;
        cursor: pointer;
        transition: 0.2s;
    }

    #playBtn:hover {
        transform: scale(1.1);
    }

    #characterSelect {
        position: absolute;
        width: 100%;
        height: 100vh;
        background: #ffd6eb;
        display: none;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
        padding-top: 40px;
    }

    #characterSelect h1 {
        margin-bottom: 30px;
        color: #ff4da6;
    }

    .character-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        width: 90%;
        gap: 20px;
    }

    .char-card {
        background: white;
        border-radius: 20px;
        padding: 10px;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
    }

    .char-card:hover {
        transform: scale(1.05);
    }

    .char-card img {
        width: 100px;
        height: 100px;
        object-fit: contain;
    }

    #game {
        display: none;
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(to bottom, #7ec8ff 0%, #7ec8ff 70%, #5ac85a 70%, #5ac85a 100%);
    }

    #sun {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: yellow;
        top: 40px;
        right: 50px;
        box-shadow: 0 0 50px yellow;
    }

    #rainbow {
        position: absolute;
        width: 300px;
        height: 150px;
        border-top-left-radius: 300px;
        border-top-right-radius: 300px;
        border: 18px solid red;
        border-bottom: none;
        left: 40px;
        bottom: 220px;
        box-sizing: border-box;
    }

    #rainbow::before {
        content: "";
        position: absolute;
        left: -18px;
        top: -18px;
        width: 264px;
        height: 114px;
        border-top-left-radius: 300px;
        border-top-right-radius: 300px;
        border: 18px solid orange;
        border-bottom: none;
    }

    #house {
        position: absolute;
        width: 220px;
        height: 200px;
        background: #ffd6eb;
        bottom: 120px;
        right: 150px;
        border: 5px solid #ff8ac2;
    }

    #roof {
        position: absolute;
        width: 0;
        height: 0;
        border-left: 130px solid transparent;
        border-right: 130px solid transparent;
        border-bottom: 120px solid #ff5ca8;
        top: -120px;
        left: -20px;
    }

    #door {
        position: absolute;
        width: 60px;
        height: 110px;
        background: #8b5a2b;
        bottom: 0;
        left: 80px;
        cursor: pointer;
    }

    #houseInside {
        position: absolute;
        width: 100%;
        height: 100%;
        display: none;
        background: #ffd6eb;
        overflow: hidden;
    }

    .floor {
        position: absolute;
        width: 100%;
        height: 180px;
        background: #8b5a2b;
        bottom: 0;
    }

    .furniture {
        position: absolute;
    }

    #bed {
        width: 220px;
        height: 90px;
        background: hotpink;
        left: 60px;
        bottom: 180px;
        border-radius: 10px;
    }

    #table {
        width: 120px;
        height: 70px;
        background: #c58a50;
        left: 400px;
        bottom: 180px;
    }

    #chair {
        width: 50px;
        height: 70px;
        background: #a66a3f;
        left: 550px;
        bottom: 180px;
    }

    #wardrobe {
        width: 120px;
        height: 200px;
        background: #b87442;
        right: 80px;
        bottom: 180px;
    }

    #diningTable {
        width: 180px;
        height: 80px;
        background: #c58a50;
        left: 700px;
        bottom: 180px;
    }

    #food {
        position: absolute;
        width: 70px;
        height: 70px;
        background-image: url('Cupcakes.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        top: -45px;
        left: 55px;
        cursor: pointer;
    }

    #eatText {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 30px;
        color: white;
        display: none;
        z-index: 99;
    }

    .cloud {
        position: absolute;
        width: 120px;
        height: 50px;
        background: white;
        border-radius: 50px;
        opacity: 0.9;
    }

    .cloud::before {
        content: "";
        position: absolute;
        width: 50px;
        height: 50px;
        background: white;
        border-radius: 50%;
        top: -20px;
        left: 15px;
    }

    .cloud::after {
        content: "";
        position: absolute;
        width: 60px;
        height: 60px;
        background: white;
        border-radius: 50%;
        top: -30px;
        right: 15px;
    }

    .player {
        position: absolute;
        width: 90px;
        height: 90px;
        object-fit: contain;
    }

    #chatBox {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 200;
        display: flex;
        gap: 10px;
    }

    #chatInput {
        padding: 10px;
        border-radius: 10px;
        border: none;
        width: 220px;
        font-size: 16px;
    }

    #chatBtn {
        padding: 10px 16px;
        border: none;
        border-radius: 10px;
        background: #7ed6ff;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #playerText {
        position: absolute;
        background: rgba(255,255,255,0.9);
        padding: 8px 14px;
        border-radius: 14px;
        font-size: 18px;
        color: black;
        white-space: nowrap;
        display: none;
        z-index: 100;
    }

    #controls {
        position: absolute;
        bottom: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 20px;
        z-index: 10;
    }

    .control-btn {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: none;
        font-size: 28px;
        background: rgba(255,255,255,0.7);
    }
</style>
</head>
<body>

<div id="menu">
    <button id="playBtn">PLAY</button>
</div>

<div id="characterSelect">
    <h1>Pilih Karakter</h1>

    <div class="character-grid" id="characterGrid"></div>
</div>

<div id="game">

    <div id="chatBox">
        <input type="text" id="chatInput" placeholder="Ketik chat...">
        <button id="chatBtn">Chat</button>
    </div>

    <div id="playerText"></div>

    <div id="sun"></div>
    <div id="rainbow"></div>

    <div id="house">
        <div id="roof"></div>
        <div id="door"></div>
    </div>

    <div id="houseInside">
        <button id="exitHouse" style="position:absolute; top:20px; right:20px; padding:10px 20px; border:none; border-radius:10px; background:#ff69b4; color:white; z-index:100;">Keluar</button>

        <div id="eatText">Yummy! 🍔</div>

        <div class="floor"></div>

        <div class="furniture" id="bed"></div>
        <div class="furniture" id="table"></div>
        <div class="furniture" id="chair"></div>
        <div class="furniture" id="wardrobe"></div>

        <div class="furniture" id="diningTable">
            <div id="food"></div>
        </div>
    </div>

    <div class="cloud" style="top:50px; left:100px;"></div>
    <div class="cloud" style="top:120px; left:500px;"></div>
    <div class="cloud" style="top:80px; left:900px;"></div>

    <div id="controls">
        <button class="control-btn" id="leftBtn">◀</button>
        <button class="control-btn" id="jumpBtn">⬆</button>
        <button class="control-btn" id="rightBtn">▶</button>
    </div>
</div>

<audio id="bgm" loop>
    <source src="Rude.mp3" type="audio/mpeg">
</audio>

<audio id="insideMusic" loop>
    <source src="Style.mp3" type="audio/mpeg">
</audio>

<script>
const characters = [
    "Yuha.png",
    "Carmen.png",
    "Jiwoo.png",
    "Yeon.png",
    "Ian.png",
    "Ana.png",
    "Juun.png",
    "Stella.png"
];

const menu = document.getElementById("menu");
const playBtn = document.getElementById("playBtn");
const characterSelect = document.getElementById("characterSelect");
const characterGrid = document.getElementById("characterGrid");
const game = document.getElementById("game");
const bgm = document.getElementById("bgm");
const insideMusic = document.getElementById("insideMusic");

let selectedPlayer = null;
let player = null;
let playerX = 300;
let playerY = 0;
let velocityY = 0;
let isJumping = false;
let moveLeft = false;
let moveRight = false;
let currentChat = "";

playBtn.onclick = () => {
    menu.style.display = "none";
    characterSelect.style.display = "flex";

    bgm.play();
};

characters.forEach(char => {
    const card = document.createElement("div");
    card.className = "char-card";

    card.innerHTML = `
        <img src="${char}">
        <p>${char.replace('.png', '')}</p>
    `;

    card.onclick = () => startGame(char);

    characterGrid.appendChild(card);
});

function startGame(charName) {
    selectedPlayer = charName;

    characterSelect.style.display = "none";
    game.style.display = "block";

    createPlayer();
    createNPCs();

    update();
}

function createPlayer() {
    player = document.createElement("img");
    player.src = selectedPlayer;
    player.className = "player";
    player.style.left = playerX + "px";
    player.style.bottom = "120px";

    game.appendChild(player);
}

function createNPCs() {
    let others = characters.filter(c => c !== selectedPlayer);

    others.forEach((npcChar, index) => {
        const npc = document.createElement("img");

        npc.src = npcChar;
        npc.className = "player";

        let x = 100 + index * 150;
        let direction = 1;

        npc.style.left = x + "px";
        npc.style.bottom = "120px";

        game.appendChild(npc);

        setInterval(() => {
            x += 2 * direction;

            if (x > window.innerWidth - 100) direction = -1;
            if (x < 0) direction = 1;

            npc.style.left = x + "px";
        }, 16);
    });
}

function update() {

    const playerText = document.getElementById("playerText");

    playerText.style.left = (playerX - 10) + "px";
    playerText.style.bottom = (220 + playerY) + "px";

    if (moveLeft) playerX -= 5;
    if (moveRight) playerX += 5;

    velocityY -= 0.5;
    playerY += velocityY;

    if (playerY <= 0) {
        playerY = 0;
        velocityY = 0;
        isJumping = false;
    }

    player.style.left = playerX + "px";
    player.style.bottom = (120 + playerY) + "px";

    requestAnimationFrame(update);
}

function jump() {
    if (!isJumping) {

        

        velocityY = 12;
        isJumping = true;
    }
}

document.getElementById("chatBtn").onclick = () => {
    currentChat = document.getElementById("chatInput").value;

    const playerText = document.getElementById("playerText");
    playerText.innerText = currentChat;
    playerText.style.display = "block";

    document.getElementById("chatInput").value = "";
};

document.getElementById("chatInput").addEventListener("keydown", e => {
    if(e.key === "Enter") {
        currentChat = document.getElementById("chatInput").value;

        const playerText = document.getElementById("playerText");
        playerText.innerText = currentChat;
        playerText.style.display = "block";

        document.getElementById("chatInput").value = "";
    }
});

// Keyboard

document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") moveLeft = true;
    if (e.key === "ArrowRight") moveRight = true;
    if (e.key === " ") jump();
});

document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft") moveLeft = false;
    if (e.key === "ArrowRight") moveRight = false;
});

// Mobile controls

document.getElementById("leftBtn").ontouchstart = () => moveLeft = true;
document.getElementById("leftBtn").ontouchend = () => moveLeft = false;

document.getElementById("rightBtn").ontouchstart = () => moveRight = true;
document.getElementById("rightBtn").ontouchend = () => moveRight = false;

document.getElementById("jumpBtn").ontouchstart = () => jump();

document.getElementById("door").onclick = () => {
    document.getElementById("houseInside").style.display = "block";

    bgm.pause();
    insideMusic.play();
};

const food = document.getElementById("food");
const eatText = document.getElementById("eatText");

document.getElementById("exitHouse").onclick = () => {
    document.getElementById("houseInside").style.display = "none";

    insideMusic.pause();
    insideMusic.currentTime = 0;

    bgm.play();
};

food.onclick = () => {
    eatText.style.display = "block";
    food.style.display = "none";

    setTimeout(() => {
        eatText.style.display = "none";
    }, 2000);
};

// Mouse support

document.getElementById("leftBtn").onmousedown = () => moveLeft = true;
document.getElementById("leftBtn").onmouseup = () => moveLeft = false;

document.getElementById("rightBtn").onmousedown = () => moveRight = true;
document.getElementById("rightBtn").onmouseup = () => moveRight = false;

document.getElementById("jumpBtn").onmousedown = () => jump();

</script>

</body>
</html>
